# Checagem automática a cada envio de código (bot 4 do painel) — TEMPORÁRIA por decisão do dono (25/set):
# vale "só nesse começo, até ir ao ar com domínio próprio"; ele dá a ordem de remover (apagar este arquivo).
# Gates reais do projeto = build + tipos (o `vite build` NÃO roda tsc). Testes unit rodam como INFORMATIVO
# (há falhas antigas conhecidas — anti-drift em telas de impressão); não bloqueiam.
# Sem segredos: o build usa valores fictícios; nenhum passo acessa o banco (sem DATABASE_URL e sem
# /tmp/dburl.txt no runner, a integração se pula sozinha).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://exemplo.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: chave-ficticia-de-build
      VITE_SUPABASE_PROJECT_ID: ficticio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Testes unit (informativo)
        continue-on-error: true
        run: npx vitest run tests/unit --no-file-parallelism
